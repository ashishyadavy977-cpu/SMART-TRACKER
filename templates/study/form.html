{% extends 'base.html' %}{% block title %}Log study{% endblock %}{% block heading %}Log a study session{% endblock %}{% block content %}<div class="panel form-panel"><form method="post" class="row g-3"><div class="col-md-6"><label>Subject</label><input class="form-control" name="subject" required></div><div class="col-md-6"><label>Study date</label><input class="form-control" type="date" name="study_date" value="{{ today }}" required></div><div class="col-md-6"><label>Topic</label><input class="form-control" name="topic"></div><div class="col-md-6"><label>Duration (hours)</label><input class="form-control" type="number" step="0.25" min="0.25" name="duration" required></div><div class="col-12"><label>Notes</label><textarea class="form-control" name="notes"></textarea></div><div><button class="btn btn-dark">Save session</button> <a class="btn btn-light" href="{{ url_for('study.list_study') }}">Cancel</a></div></form></div>{% endblock %}
