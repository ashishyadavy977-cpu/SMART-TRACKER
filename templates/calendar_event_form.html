{% extends 'base.html' %}
{% block title %}{{ 'Edit' if event else 'Add' }} calendar event{% endblock %}
{% block heading %}{{ 'Edit calendar event' if event else 'Add calendar event' }}{% endblock %}
{% block content %}<div class="panel form-panel"><form method="post" class="row g-3"><div class="col-md-8"><label>Title</label><input class="form-control" name="title" value="{{ event.title if event else '' }}" required></div><div class="col-md-4"><label>Type</label><select class="form-select" name="event_type">{% for value in ['reminder','personal','study','other'] %}<option value="{{ value }}" {{ 'selected' if event and event.event_type == value else '' }}>{{ value|capitalize }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Date</label><input class="form-control" type="date" name="event_date" value="{{ event.event_date if event else today }}" required></div><div class="col-md-6"><label>Time</label><input class="form-control" type="time" name="event_time" value="{{ event.event_time.strftime('%H:%M') if event and event.event_time else '' }}"></div><div class="col-12"><label>Description</label><textarea class="form-control" name="description">{{ event.description if event else '' }}</textarea></div><div><button class="btn btn-dark">Save event</button> <a class="btn btn-light" href="{{ url_for('smart.calendar') }}">Cancel</a></div></form></div>{% endblock %}
