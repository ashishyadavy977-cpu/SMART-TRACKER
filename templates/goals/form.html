{% extends 'base.html' %}{% block title %}{{ 'Edit' if goal else 'Add' }} goal{% endblock %}{% block heading %}{{ 'Edit goal' if goal else 'Create a goal' }}{% endblock %}{% block content %}<div class="panel form-panel"><form method="post" class="row g-3"><div class="col-12"><label>Goal title</label><input class="form-control" name="title" value="{{ goal.title if goal else '' }}" required></div><div class="col-12"><label>Description</label><textarea class="form-control" name="description">{{ goal.description if goal else '' }}</textarea></div><div class="col-md-6"><label>Target date</label><input class="form-control" type="date" name="target_date" value="{{ goal.target_date if goal else today }}" required></div><div class="col-md-6"><label>Progress (%)</label><input class="form-control" type="number" name="progress" min="0" max="100" value="{{ goal.progress if goal else 0 }}" required></div><div><button class="btn btn-dark">Save goal</button> <a class="btn btn-light" href="{{ url_for('goals.list_goals') }}">Cancel</a></div></form></div>{% endblock %}
