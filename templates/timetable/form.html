{% extends 'base.html' %}
{% block title %}{{ 'Edit' if timetable else 'Add' }} class{% endblock %}
{% block heading %}{{ 'Edit timetable class' if timetable else 'Add a timetable class' }}{% endblock %}
{% block content %}
<div class="panel form-panel"><form method="post" class="row g-3"><div class="col-md-4"><label>Day</label><select class="form-select" name="day" required>{% for day in days %}<option value="{{ day }}" {{ 'selected' if timetable and timetable.day == day }}>{{ day }}</option>{% endfor %}</select></div><div class="col-md-8"><label>Subject</label><input class="form-control" name="subject" value="{{ timetable.subject if timetable else '' }}" required></div><div class="col-md-6"><label>Faculty</label><input class="form-control" name="faculty" value="{{ timetable.faculty if timetable else '' }}"></div><div class="col-md-6"><label>Room</label><input class="form-control" name="room" value="{{ timetable.room if timetable else '' }}"></div><div class="col-md-6"><label>Start time</label><input class="form-control" type="time" name="start_time" value="{{ timetable.start_time.strftime('%H:%M') if timetable else '' }}" required></div><div class="col-md-6"><label>End time</label><input class="form-control" type="time" name="end_time" value="{{ timetable.end_time.strftime('%H:%M') if timetable else '' }}" required></div><div><button class="btn btn-dark">Save class</button> <a class="btn btn-light" href="{{ url_for('timetable.list_timetable') }}">Cancel</a></div></form></div>
{% endblock %}
