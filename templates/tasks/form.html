{% extends 'base.html' %}{% block title %}{{ 'Edit' if task else 'Add' }} task{% endblock %}{% block heading %}{{ 'Edit task' if task else 'Add a task' }}{% endblock %}{% block content %}<div class="panel form-panel"><form method="post" class="row g-3"><div class="col-12"><label>Title</label><input class="form-control" name="title" value="{{ task.title if task else '' }}" required></div><div class="col-12"><label>Description</label><textarea class="form-control" name="description">{{ task.description if task else '' }}</textarea></div><div class="col-md-4"><label>Priority</label><select class="form-select" name="priority">{% for p in ['high','medium','low'] %}<option {{ 'selected' if task and task.priority==p }}>{{ p }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Due date</label><input class="form-control" type="date" name="due_date" value="{{ task.due_date if task else today }}" required></div><div class="col-md-4"><label>Status</label><select class="form-select" name="status"><option value="pending">Pending</option><option value="completed" {{ 'selected' if task and task.status=='completed' }}>Completed</option></select></div><div><button class="btn btn-dark">Save task</button> <a class="btn btn-light" href="{{ url_for('tasks.list_tasks') }}">Cancel</a></div></form></div>{% endblock %}
