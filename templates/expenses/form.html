{% extends 'base.html' %}{% block title %}Add expense{% endblock %}{% block heading %}Record an expense{% endblock %}{% block content %}<div class="panel form-panel"><form method="post" class="row g-3"><div class="col-md-6"><label>Amount</label><input class="form-control" type="number" min="0.01" step="0.01" name="amount" required></div><div class="col-md-6"><label>Date</label><input class="form-control" type="date" name="expense_date" value="{{ today }}" required></div><div class="col-md-6"><label>Category</label><select class="form-select" name="category">{% for c in ['Food','Travel','Education','Shopping','Entertainment','Other'] %}<option>{{ c }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Description</label><input class="form-control" name="description"></div><div><button class="btn btn-dark">Save expense</button> <a class="btn btn-light" href="{{ url_for('expenses.list_expenses') }}">Cancel</a></div></form></div>{% endblock %}
