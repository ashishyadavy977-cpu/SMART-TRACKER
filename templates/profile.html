{% extends 'base.html' %}{% block title %}Profile{% endblock %}{% block heading %}Your profile{% endblock %}{% block content %}<div class="panel profile-panel"><span class="eyebrow">Account settings</span><h2>Personal details</h2><form method="post" class="row g-3 mt-2"><div class="col-md-6"><label>Full name</label><input class="form-control" name="name" value="{{ user.name }}" required></div><div class="col-md-6"><label>Email</label><input class="form-control" value="{{ user.email }}" disabled></div><div class="col-md-6"><label>Course</label><input class="form-control" name="course" value="{{ user.course }}" required></div><div class="col-md-6"><label>Semester</label><input class="form-control" name="semester" value="{{ user.semester }}" required></div><div><button class="btn btn-dark">Save changes</button></div></form></div>{% endblock %}
