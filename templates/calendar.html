{% extends 'base.html' %}
{% block title %}Calendar{% endblock %}
{% block heading %}Smart calendar{% endblock %}
{% block content %}
<div class="panel"><div class="panel-head"><div><span class="eyebrow">Your activity map</span><h2>All commitments in one place</h2></div><a class="btn btn-dark btn-sm" href="{{ url_for('smart.add_calendar_event') }}"><i class="bi bi-plus"></i> Add event</a></div><div class="btn-group mb-3" role="group"><button class="btn btn-dark calendar-view" data-view="month">Monthly</button><button class="btn btn-light calendar-view" data-view="week">Weekly</button><button class="btn btn-light calendar-view" data-view="day">Daily</button></div><div id="calendarGrid" class="calendar-grid"></div></div>
{% endblock %}
{% block scripts %}<script>
(() => { const grid = document.getElementById('calendarGrid'); let events = []; let view = 'month'; const render = () => { const today = new Date(); const start = view === 'day' ? today.toISOString().slice(0,10) : view === 'week' ? new Date(today.getTime() - today.getDay() * 86400000).toISOString().slice(0,10) : today.toISOString().slice(0,7); const visible = events.filter(item => view === 'month' ? item.start.startsWith(start) : view === 'day' ? item.start === start : item.start >= start && item.start <= new Date(today.getTime() + (6 - today.getDay()) * 86400000).toISOString().slice(0,10)); const groups = {}; visible.forEach(item => (groups[item.start] ||= []).push(item)); grid.innerHTML = Object.entries(groups).sort().map(([day, items]) => `<div class="calendar-day" data-date="${day}"><span>${day}</span>${items.map(item => `<a href="${item.url || '#'}" style="border-left-color:${item.color}" title="${item.title}">${item.title}</a>`).join('')}</div>`).join('') || '<div class="empty">No scheduled activity for this view.</div>'; }; document.querySelectorAll('.calendar-view').forEach(button => button.addEventListener('click', () => { view = button.dataset.view; document.querySelectorAll('.calendar-view').forEach(item => item.classList.toggle('btn-dark', item === button)); document.querySelectorAll('.calendar-view').forEach(item => item.classList.toggle('btn-light', item !== button)); render(); })); fetch('{{ url_for("smart.calendar_events") }}').then(response => response.json()).then(data => { events = data; render(); }); })();
</script>{% endblock %}
