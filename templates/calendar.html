{% extends 'base.html' %}{% block title %}Calendar{% endblock %}{% block heading %}Smart calendar{% endblock %}{% block content %}<div class="panel"><div class="panel-head"><div><span class="eyebrow">Your activity map</span><h2>Tasks, goals and study</h2></div><a class="btn btn-dark btn-sm" href="{{ url_for('tasks.add_task') }}"><i class="bi bi-plus"></i> Add task</a></div><div id="calendarGrid" class="calendar-grid"></div></div>{% endblock %}{% block scripts %}<script>fetch('{{ url_for("smart.calendar_events") }}').then(r=>r.json()).then(events=>{const grid=document.getElementById('calendarGrid');const groups={};events.forEach(e=>(groups[e.start]??=[]).push(e));Object.entries(groups).sort().forEach(([day,items])=>{grid.innerHTML+=`<div class="calendar-day"><span>${day}</span>${items.map(e=>`<a href="${e.url||'#'}" style="border-left-color:${e.color}">${e.title}</a>`).join('')}</div>`)});if(!events.length)grid.innerHTML='<div class="empty">No scheduled activity yet.</div>'})</script>{% endblock %}
