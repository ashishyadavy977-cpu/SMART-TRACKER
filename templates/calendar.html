{% extends 'base.html' %}{% block title %}Calendar{% endblock %}{% block heading %}Smart calendar{% endblock %}{% block content %}<div class="panel"><div class="panel-head"><div><span class="eyebrow">Your activity map</span><h2>Tasks, goals and study</h2></div><a class="btn btn-dark btn-sm" href="{{ url_for('tasks.add_task') }}"><i class="bi bi-plus"></i> Add task</a></div><div id="calendarGrid" class="calendar-grid"></div></div>{% endblock %}{% block scripts %}<script>fetch('{{ url_for("smart.calendar_events") }}').then(r=>r.json()).then(events=>{const grid=document.getElementById('calendarGrid');const groups={};events.forEach(e=>(groups[e.start]??=[]).push(e));Object.entries(groups).sort().forEach(([day,items])=>{grid.innerHTML+=`<div class="calendar-day" data-date="${day}"><span>${day}</span>${items.map(e=>`<a ${e.id.startsWith('task-')?'draggable="true" data-task-id="'+e.id.slice(5)+'"':''} href="${e.url||'#'}" style="border-left-color:${e.color}">${e.title}</a>`).join('')}</div>`)});if(!events.length)grid.innerHTML='<div class="empty">No scheduled activity yet.</div>';document.querySelectorAll('.calendar-day').forEach(day=>{day.addEventListener('dragover',event=>event.preventDefault());day.addEventListener('drop',event=>{event.preventDefault();const taskId=event.dataTransfer.getData('task-id');if(!taskId)return;fetch(`/api/calendar/tasks/${taskId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:day.dataset.date})}).then(response=>{if(!response.ok)throw new Error();return response.json()}).then(()=>window.location.reload()).catch(()=>alert('Could not reschedule this task.'))});day.querySelectorAll('[data-task-id]').forEach(task=>task.addEventListener('dragstart',event=>event.dataTransfer.setData('task-id',task.dataset.taskId)))})})</script>{% endblock %}
