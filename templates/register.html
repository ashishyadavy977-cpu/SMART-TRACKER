{% extends 'base.html' %}{% block title %}Create account{% endblock %}{% block content %}<div class="auth-wrap"><div class="auth-card wide"><span class="eyebrow">Build your rhythm</span><h1>Create your student account</h1><form method="post" class="row g-3 mt-3"><div class="col-md-6"><label>Full name</label><input class="form-control" name="name" required></div><div class="col-md-6"><label>Email</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label>Course</label><input class="form-control" name="course" placeholder="BSc Computer Science" required></div><div class="col-md-6"><label>Semester</label><input class="form-control" name="semester" placeholder="Semester 6" required></div><div class="col-12"><label>Password</label><input class="form-control" type="password" name="password" minlength="8" required><small class="text-muted">Use at least 8 characters.</small></div><div class="col-12"><button class="btn btn-dark w-100">Create account <i class="bi bi-arrow-right"></i></button></div></form><p class="text-muted mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div>{% endblock %}
